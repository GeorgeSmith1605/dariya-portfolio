      document.querySelectorAll('.iso-building').forEach(el => el.classList.remove('active'));
      const activeBuilding = document.getElementById('station-' + key);
      if (activeBuilding) activeBuilding.classList.add('active');

      // Update buttons
      document.querySelectorAll('[id^="btn-"]').forEach(btn => {
        btn.className = "px-3 py-1 rounded-full text-xs font-medium text-gray-600 hover:text-brandDark transition";
      });
      const activeBtn = document.getElementById('btn-' + key);
      if (activeBtn) {
        activeBtn.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-800 text-white transition";
      }

      // Render Card
      const card = document.getElementById('detailCard');
      card.innerHTML = `
        <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 border-b border-gray-100 pb-5">
          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <span class="text-xs font-semibold uppercase tracking-wider text-gray-400 font-sans">${data.period}</span>
              <span class="text-xs px-2.5 py-0.5 rounded-full font-medium ${data.badgeColor}">${data.badge}</span>
            </div>
            <h2 class="font-serif text-3xl font-bold text-brandDark">${data.title}</h2>
            <p class="text-base font-semibold text-emerald-800 pt-0.5">${data.role} — <span class="font-normal text-gray-500">${data.location}</span></p>
          </div>
          <a href="https://www.behance.net/dariyaaa" target="_blank" rel="noopener noreferrer" class="self-start inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-xs font-semibold bg-brandDark text-white hover:bg-emerald-900 transition shadow-sm">
            <span>Explore Portfolio</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </a>
        </div>

        <p class="text-sm text-gray-600 leading-relaxed pt-5 max-w-3xl">${data.desc}</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 pt-4">
          ${data.bullets.map(b => `
            <div class="flex items-start text-xs text-gray-700">
              <span class="text-emerald-700 font-bold mr-2 text-sm leading-none">•</span>
              <span>${b}</span>
            </div>
          `).join('')}
        </div>

        <div class="flex flex-wrap gap-2 pt-6 mt-4 border-t border-gray-100">
          ${data.tags.map(t => `
            <span class="px-3 py-1 rounded-lg text-xs font-medium bg-[#edf2f0] text-brandDark">
              ${t}
            </span>
          `).join('')}
        </div>
      `;
    }

    // Initialize with Graz
    selectStation('graz');
  </script>
</body>
