        b.querySelector('rect').setAttribute('stroke', 'none');

        activeBadge.querySelector('rect').setAttribute('stroke', '#ffffff');
        activeBadge.querySelector('rect').setAttribute('stroke-width', '2');

      });
      const activeBtn = document.getElementById('btn-' + key);

      }
